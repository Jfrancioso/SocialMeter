# Continuous integration: every push and pull request builds the API and runs the free unit tests.
# The paid Claude eval (Category=Eval) is excluded on purpose; run it by hand when the prompt changes.
# A package with a known High or Critical vulnerability, direct or pulled in by another package, fails the run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow token can only read the repository; nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SocialMeter.sln

      - name: Vulnerable packages
        run: |
          dotnet list SocialMeter.sln package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]
                 | . as $p | .vulnerabilities[] | "\(.severity)\t\($p.id) \($p.resolvedVersion)\t\(.advisoryurl)"' vulnerable.json \
            | sort -u > vulnerable.txt
          if [ -s vulnerable.txt ]; then cat vulnerable.txt; else echo "No known vulnerable packages."; fi
          if grep -qE '^(High|Critical)' vulnerable.txt; then
            echo "::error::NuGet packages with High or Critical vulnerabilities (listed above). Update them to a patched version."
            exit 1
          fi

      - name: Build
        run: dotnet build SocialMeter.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test SocialMeter.sln --configuration Release --no-build --filter "Category!=Eval" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/results.trx"
