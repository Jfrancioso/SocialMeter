# Continuous integration: every push and pull request builds the API and runs the free unit tests.
# The paid Claude eval (Category=Eval) is excluded on purpose; run it by hand when the prompt changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SocialMeter.sln

      - name: Build
        run: dotnet build SocialMeter.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test SocialMeter.sln --configuration Release --no-build --filter "Category!=Eval" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"
