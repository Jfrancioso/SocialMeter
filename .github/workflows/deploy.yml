# Continuous deployment: a push to main that passes CI is published to the Azure App Service named in the
# AZURE_WEBAPP_NAME repository variable. Until that variable is set (see docs/DEPLOY.md and infra/azure-provision.ps1)
# this workflow does nothing, so CI alone is safe to merge.
#
# No password is stored anywhere: the deploy job asks GitHub for a short-lived token (OIDC), and Azure trusts it only
# for this repository's "production" environment (the federated credential on the managed identity
# socialmeter-jf-deploy, whose only permission is Website Contributor on the API app). The identity's IDs are plain
# repository variables; they are not secrets.
name: Deploy API

on:
  push:
    branches: [main]
    # A restart costs ~30 s of API downtime; documentation changes never need one.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/security-scan.yml"
      - ".zap/**"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

# The workflow token can only read the repository. The deploy job alone may also request an OIDC token for Azure.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - run: dotnet test SocialMeter.sln --configuration Release --filter "Category!=Eval"

  deploy:
    needs: test
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    # The App Service only answers Cloudflare, so the health check goes through the public address like any visitor.
    env:
      API_URL: ${{ vars.API_PUBLIC_URL || 'https://api.chatterbub.com' }}
    environment:
      name: production
      url: ${{ vars.API_PUBLIC_URL || 'https://api.chatterbub.com' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish SocialMeter/SocialMeter.csproj --configuration Release --output publish

      - name: Sign in to Azure (OIDC, no stored password)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/api/health")
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 15
          done
          echo "health check never returned 200" && exit 1
